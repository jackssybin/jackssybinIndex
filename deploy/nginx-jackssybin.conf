# jackssybin.cn nginx configuration
#
# Two server blocks:
#   1. HTTP :80  -> 301 to HTTPS
#   2. HTTPS    -> serve the Hugo static site, with www -> non-www redirect
#
# Replace /etc/letsencrypt/live/jackssybin.cn/ paths with your real cert paths.
# Test with: nginx -t
# Reload with: nginx -s reload
#
# ============================================================================
# 2026-09-18 搜索引擎抓取修复（百度收录归零的根因）
#
# 三条铁律，后续改动请勿破坏：
#
#  1. 不要返回 403。百度把 403 判为「抓取被拒绝」并削减整站抓取配额；
#     Google 只当作「暂时不可用」，所以同一套配置会出现百度掉收录、
#     Google 正常的局面。资源不存在就返回 404。
#     本文件末尾有 error_page 403 =404 兜底。
#
#  2. 301 的目标页不能被 robots.txt Disallow。爬虫跟随 301 落到禁抓页后，
#     百度会把原 URL 静默移出索引且不传递权重。
#     已删除 @tag-search（原先 /tags/xxx -> /search.html?keyword=xxx，
#     而 /search.html 在 robots.txt 里是 Disallow）。
#
#  3. 参数化 URL 不要返回首页副本。老站分页 /?p=N 曾与首页字节完全相同，
#     属于重复内容，现统一返回 410。
# ============================================================================

