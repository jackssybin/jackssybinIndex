}

# --- HTTP -> HTTPS -------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jackssybin.cn www.jackssybin.cn;

    # Allow ACME http-01 challenges if using certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://jackssybin.cn$request_uri;
    }
}

# --- HTTPS main site ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jackssybin.cn;

    ssl_certificate     /etc/letsencrypt/live/jackssybin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackssybin.cn/privkey.pem;

    # www -> non-www (canonical host)
    return 301 https://jackssybin.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jackssybin.cn;

    root /var/www/jackssybin;
    index index.html;
    # 老 URL 一律 301 到新的 ASCII slug
    if ($legacy_redirect_uri != "") {
        return 301 $legacy_redirect_uri;
    }

    # 老站 Solo 的分页参数 /?p=N ：当年这些 URL 返回的是与首页字节完全相同的
    # 副本（重复内容）。它们没有任何独有内容，也不可能再恢复，统一返回 410，
    # 给百度一个干净的「已永久移除」信号，由百度自行清出索引。
    # 注意：不要改成 return 301 / 或 return 301 /page/$arg_p.html ——
    # 前者制造新的重复内容，后者会把权重导向 noindex 页面。
    if ($arg_p != "") {
        return 410;
    }

    # ------------------------------------------------------------------------
    # 老式栏目入口 -> 真实存在的 .html 落地页
    #
    # 这些目录在当前 Hugo 构建里没有 index.html（Hugo 只为 /archives/YYYY/MM/
    # 这种叶子层生成 index.html），直接请求会命中 nginx 的目录索引逻辑并返回
    # 403。这里把它们 301 到真正有内容的 .html 页面，既消除 403，
    # 又保住改版前这些 URL 的入口价值。
    # ------------------------------------------------------------------------
    location = /archives         { return 301 /archives.html; }
    location = /archives/        { return 301 /archives.html; }
    location = /tags/            { return 301 /tags.html; }
    location = /topics/          { return 301 /topics.html; }
    location = /nav/             { return 301 /nav.html; }
    location = /mysql/           { return 301 /mysql.html; }
    location = /netty/           { return 301 /netty.html; }
    location = /linux/           { return 301 /linux.html; }
    location = /springboot4/     { return 301 /springboot4.html; }

    access_log /var/log/nginx/jackssybin.access.log;
    error_log  /var/log/nginx/jackssybin.error.log;

    ssl_certificate     /etc/letsencrypt/live/jackssybin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackssybin.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (already set in the live site, kept explicit here)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets: long cache
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 标签页：存在就 200，不存在就 404。
    #
    # 原实现是 try_files $uri $uri.html @tag-search，而 @tag-search 会
    # 301 到 /search.html?keyword=xxx —— /search.html 在 robots.txt 里是
    # Disallow。百度跟随 301 落到禁抓页后，会把原 URL 静默清出索引且不传权重，
    # 这是改版后标签页收录归零的直接原因。现改为直接 404。
    #
    # 标签页当前带 noindex（layouts/_default/baseof.html），所以 404 与 200
    # 对收录结果一致，但 404 不会留下「重定向到禁抓页」的异常记录。
    location ~ ^/tags/(?<tag>[^/.]+)(?:\.html)?/?$ {
        try_files /tags/$tag.html =404;
    }

    # Article URLs exist in two historical forms: new Hugo posts emit
    # name/index.html, while older posts are physical name.html files. Canonicalize
    # each request to the file that actually exists so Baidu never gets a 404 from
    # a previously discovered URL shape.
    #
    # 注意：这里的 try_files 只能探测 $article_base/index.html，不能写成
    # $uri（即 /articles/xxxx/ 本身）——那会命中目录并触发 403 或死循环。
    location ~ ^(?<article_base>/articles/.+)/$ {
        if (-f $document_root$article_base.html) {
            return 301 $article_base.html;
        }
        try_files $article_base/index.html =404;
    }

    location ~ ^(?<article_base>/articles/.+)\.html$ {
        if (-f $document_root$article_base/index.html) {
            return 301 $article_base/;
        }
        try_files $uri =404;
    }

    # Real .html files must exist; never fall back to /index.html, otherwise
    # Baidu would fetch the homepage for every missing article URL.
    location ~ \.html$ {
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # 兜底：任何「目录请求但没有 index.html」一律 404，绝不 403。
    #
    # 缘由：Hugo 的产物里存在大量中间层空目录（/archives/、/archives/2019/、
    # /articles/2019/07/、/images/<文章名>/、/nav-logos/ ... 共 447 个），
    # nginx 默认对无 index 的目录返回 403。百度把 403 判为抓取失败，
    # 会削减整站抓取配额。
    #
    # 必须放在上面 article 规则之后：正则 location 按出现顺序匹配，
    # 这个规则会匹配所有以 / 结尾的 URI。
    # ------------------------------------------------------------------------
    location ~ ^(?<dirpath>.+)/$ {
        try_files $dirpath/index.html =404;
    }

    # GoAccess private report page (kept from original config)
    location = /admin/report.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
        try_files $uri =404;
    }

    # Pretty URLs and directories
    # ⚠️ 这个 try_files 的顺序不能动，每一项都有明确职责：
    #      $uri      真实存在的文件
    #      $uri.html 无扩展名的漂亮 URL（/tags → /tags.html）
    #      $uri/     目录，交给 index 模块（首页 / 全靠这一项）
    #      =404      都没有就是 404 —— 绝不 fallback 到 /index.html
    #
    # 关键：try_files 只在参数【以 / 结尾】时才把目录视为匹配，
    # 所以 `$uri` 这一项对目录是「跳过」的（配置里写的是 $uri，不以 / 结尾）。
    # 这就意味着：删掉 $uri/ 会让 `/` 直接落到 =404。
    # 2026-09-18 曾把 $uri/ 删掉（当时误以为它会引发 403），
    # 结果首页 404、全站首页权重归零 —— 已用真实 nginx 实测复现并修回。
    # 目录型的 403 由上方 ^(?<dirpath>.+)/$ 规则接管，与本行无关。
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    # 兜底：本站不存在任何「应当返回 403」的资源。万一还有漏网的 403
    # （权限配置、符号链接、双斜杠等），也统一降级成 404，
    # 避免百度把它当成抓取被拒绝而削减整站配额。
    error_page 403 =404 /404.html;
    location = /404.html {
        root /var/www/jackssybin;
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }
}


