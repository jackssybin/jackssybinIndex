# --- HTTP -> HTTPS -------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jackssybin.cn www.jackssybin.cn;

    # Allow ACME http-01 challenges if using certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://jackssybin.cn$request_uri;
    }
}

# --- HTTPS main site ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jackssybin.cn;

    ssl_certificate     /etc/letsencrypt/live/jackssybin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackssybin.cn/privkey.pem;

    # www -> non-www (canonical host)
    return 301 https://jackssybin.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jackssybin.cn;

    root /var/www/jackssybin;
    index index.html;
    # Redirect old garbled tutorial URLs to clean slugs
    if ($new_tutorial_uri != "") {
        return 301 $new_tutorial_uri;
    }

    access_log /var/log/nginx/jackssybin.access.log;
    error_log  /var/log/nginx/jackssybin.error.log;

    ssl_certificate     /etc/letsencrypt/live/jackssybin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackssybin.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (already set in the live site, kept explicit here)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets: long cache
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Real .html files must exist; never fall back to /index.html, otherwise
    # Baidu would fetch the homepage for every missing article URL.
    location ~ \.html$ {
        try_files $uri =404;
    }

    # GoAccess private report page (kept from original config)
    location = /admin/report.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
        try_files $uri =404;
    }

    # Article pretty URL: redirect /articles/.../name/ to /articles/.../name.html
    # so Baidu does not treat the trailing-slash variant as a separate 404.
    location ~ ^(/articles/.+)/$ {
        return 301 $1.html;
    }

    # Pretty URLs and directories
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/jackssybin;
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }
}


