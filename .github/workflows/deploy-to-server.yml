name: Deploy to Server

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for Unicode filenames
        run: git config core.quotepath false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Fetch hourly hot news
        run: pnpm fetch-hot-news

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI nav scraper deps
        run: pip install requests beautifulsoup4 lxml

      - name: Refresh AI nav data
        continue-on-error: true
        run: python scripts/ai-nav/update.py


      - name: Sync Hugo data
        run: pnpm sync:hugo

      - name: Build Hugo static site
        run: hugo --destination public --minify --cleanDestinationDir --enableGitInfo


      - name: Deploy dist to server
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ secrets.SERVER_PORT || 22 }}
          SOURCE: public/
          TARGET: ${{ secrets.SERVER_PATH }}
          ARGS: -rlgoDzvc --delete --exclude=admin/**
      - name: Sync nginx config and reload
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ secrets.SERVER_PORT || 22 }}
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$REMOTE_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -P "$REMOTE_PORT" deploy/nginx-jackssybin.conf "$REMOTE_USER@$REMOTE_HOST:/tmp/jackssybin.conf"
          # Best effort: try common nginx config locations. The deploy user must
          # have passwordless sudo for nginx/cp/ln, otherwise this step is skipped
          # without failing the deploy (continue-on-error).
          ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" '
            set -e
            sudo cp /tmp/jackssybin.conf /etc/nginx/sites-available/jackssybin.conf
            sudo rm -f /etc/nginx/conf.d/jackssybin.conf /etc/nginx/conf.d/jackssybin.conf.bak.*
            if [ -d /etc/nginx/sites-enabled ]; then
              sudo ln -sf /etc/nginx/sites-available/jackssybin.conf /etc/nginx/sites-enabled/jackssybin.conf
            fi
            sudo nginx -t
            sudo nginx -s reload
          '
      - name: Verify robots.txt contains sitemap
        run: |
          sleep 5
          ROBOTS=$(curl -fsSL https://jackssybin.cn/robots.txt || true)
          echo "Live robots.txt:"
          echo "$ROBOTS"
          if echo "$ROBOTS" | grep -q "Sitemap:"; then
            echo "robots.txt contains Sitemap directive"
          else
            echo "ERROR: robots.txt is missing Sitemap directive!"
            exit 1
          fi

  # 百度主动推送单独成一个 job，而不是挂在部署 job 里的一个 continue-on-error 步骤。
  #
  # 原因：旧写法把「推送成功」和「token 失效」渲染成一模一样的绿色日志，
  # 结果推送链路断了几个月都没人发现（详见 SEO-百度收录丢失诊断报告 8.4）。
  # 拆成独立 job 后：部署状态照旧只看 build-and-deploy，
  # 而推送的成败在 Actions 列表里是一行独立的状态，失效会立刻显红。
  baidu-push:
    name: Push URLs to Baidu
    needs: build-and-deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit changed URLs to Baidu
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          # 2026-09-18 首次成功推送时的实测数据：{"remain":4,"success":4}
          # 也就是百度给这个站的当日配额只有个位数。原来设 50 会让整批撞上
          # over quota（百度对超配额的处理是拒绝整批，不是接受前 N 条），
          # 所以这里必须贴近真实配额，宁可分几天推完。
          BAIDU_PUSH_MAX: '10'
          BAIDU_PUSH_SUMMARY: baidu-push-summary.json
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${BAIDU_PUSH_TOKEN:-}" ]; then
            {
              echo "## ❌ 百度主动推送未执行"
              echo ""
              echo "仓库 Secret \`BAIDU_PUSH_TOKEN\` 未配置，整条主动推送链路是断的。"
              echo "到 https://ziyuan.baidu.com/ 「链接提交 → API 提交」取 token，"
              echo "加到 Settings → Secrets and variables → Actions。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BAIDU_PUSH_TOKEN 未配置，百度主动推送未执行"
            exit 1
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          echo "Diff range: $BEFORE..HEAD"
          export BAIDU_PUSH_DIFF_BASE="$BEFORE"
          export BAIDU_PUSH_DIFF_HEAD="HEAD"

          # 参数取舍（2026-09-18 实测后定的）：
          #   --changed          只推本次改动过的正文
          #   --probe-if-empty   没有正文变更时推 1 条最新页，验证链路是否通
          #   --max=10           配额只有个位数（实测 remain=4 -> 0），贴近真实值
          #
          # 曾经用过 --fallback-since=2（无变更时推最近 2 天更新的页面），实测后去掉：
          # 连续两次部署推的是**完全相同**的 4 条 URL，百度照样返回 {"success":4}
          # 并把配额从 4 扣到 0 —— 重复推送同一 URL 会照常消耗配额。
          # 每天配额就 8 条左右，这种「顺便补推」等于白烧配额。
          node scripts/baidu-push.mjs \
            --changed --probe-if-empty \
            --max="$BAIDU_PUSH_MAX" --summary="$BAIDU_PUSH_SUMMARY"
          CODE=$?
          echo "baidu-push exit code: $CODE"

          if [ -f "$BAIDU_PUSH_SUMMARY" ]; then
            {
              echo "## 百度主动推送结果"
              echo ""
              echo '```json'
              cat "$BAIDU_PUSH_SUMMARY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # 退出码语义见 scripts/baidu-push.mjs 头部注释
          case "$CODE" in
            0) echo "✅ 推送成功或被正常跳过" ;;
            3)
              echo "::warning::当日推送配额已用尽，属于正常限流，剩余 URL 明日自动继续"
              ;;
            2)
              echo "::error::推送配置有问题：token 失效或站点未通过归属验证，需要人工到站长平台处理"
              exit 1
              ;;
            *)
              echo "::error::推送出现运行时错误，见上方日志"
              exit 1
              ;;
          esac



