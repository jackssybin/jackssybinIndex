{{- $alt := .Text -}}
{{- $src := .Destination -}}
{{- $title := .Title -}}
{{- $dimensions := dict -}}
{{- with index hugo.Data "image-dimensions" }}
  {{- with index . $src }}
    {{- $dimensions = . -}}
  {{- end }}
{{- end }}
<img src="{{ $src | safeURL }}" alt="{{ $alt }}" {{ with $title }}title="{{ . }}"{{ end }}{{ with $dimensions }} width="{{ .width }}" height="{{ .height }}"{{ end }}{{ if or (hasPrefix $src "https://static.oschina.net/") (hasPrefix $src "https://pic1.zhimg.com/") }} referrerpolicy="no-referrer"{{ end }} loading="lazy" decoding="async">
