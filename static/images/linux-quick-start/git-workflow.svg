<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Git 快速入门流程</title>
  <desc id="desc">安装并配置 Git，创建首次提交，通过分支开发并合并，最后连接远程仓库推送。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <text x="72" y="94" fill="#bfdbfe" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24">LINUX 开发者基础命令教程</text>
  <text x="72" y="158" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="46" font-weight="700">Git 快速入门：从本地提交到远程推送</text>
  <path d="M 240 364 H 350 M 510 364 H 620 M 780 364 H 890" stroke="#93c5fd" stroke-width="6" marker-end="url(#arrow)"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g><rect x="70" y="250" width="190" height="230" rx="22" fill="#ffffff" opacity="0.96"/><text x="165" y="306" text-anchor="middle" font-size="24" fill="#1e40af">01 安装配置</text><text x="165" y="362" text-anchor="middle" font-size="20" fill="#0f172a">git --version</text><text x="165" y="406" text-anchor="middle" font-size="20" fill="#0f172a">user.name</text><text x="165" y="444" text-anchor="middle" font-size="20" fill="#0f172a">user.email</text></g>
    <g><rect x="340" y="250" width="190" height="230" rx="22" fill="#ffffff" opacity="0.96"/><text x="435" y="306" text-anchor="middle" font-size="24" fill="#1e40af">02 首次提交</text><text x="435" y="362" text-anchor="middle" font-size="20" fill="#0f172a">git init</text><text x="435" y="406" text-anchor="middle" font-size="20" fill="#0f172a">git add .</text><text x="435" y="444" text-anchor="middle" font-size="20" fill="#0f172a">git commit</text></g>
    <g><rect x="610" y="250" width="190" height="230" rx="22" fill="#ffffff" opacity="0.96"/><text x="705" y="306" text-anchor="middle" font-size="24" fill="#1e40af">03 分支合并</text><text x="705" y="362" text-anchor="middle" font-size="20" fill="#0f172a">git checkout -b</text><text x="705" y="406" text-anchor="middle" font-size="20" fill="#0f172a">开发并提交</text><text x="705" y="444" text-anchor="middle" font-size="20" fill="#0f172a">git merge</text></g>
    <g><rect x="880" y="250" width="300" height="230" rx="22" fill="#ffffff" opacity="0.96"/><text x="1030" y="306" text-anchor="middle" font-size="24" fill="#1e40af">04 远程推送</text><text x="1030" y="362" text-anchor="middle" font-size="20" fill="#0f172a">git remote add origin</text><text x="1030" y="406" text-anchor="middle" font-size="20" fill="#0f172a">git push -u origin main</text><text x="1030" y="444" text-anchor="middle" font-size="20" fill="#0f172a">git clone 验证</text></g>
  </g>
  <text x="72" y="610" fill="#dbeafe" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24">与正文四个操作阶段一一对应 · 命令以页面代码块为准</text>
</svg>
