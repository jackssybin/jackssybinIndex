baseURL = "https://jackssybin.cn/"
title = "jackssybin 的个人博客"
description = "记录精彩的程序人生，分享技术教程与成长经验"
author = "jackssybin"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[pagination]
pagerSize = 10

[markup.goldmark.renderer]
unsafe = true

[outputs]
home = ["HTML", "RSS", "SITEMAP"]
section = ["HTML"]
page = ["HTML"]

[outputFormats.RSS]
baseName = "rss"
mediaType = "application/rss+xml"

[outputFormats.SITEMAP]
baseName = "sitemap"
mediaType = "application/xml"

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

[params]
description = "记录精彩的程序人生，分享Java、SpringBoot、Netty等技术教程"
keywords = "编程,Java,SpringBoot,后端开发,技术博客"
author = "jackssybin"

[params.geo]
region = "CN"
placename = "China"

[params.seo]
# Google Search Console 验证串。
#   在 https://search.google.com/search-console 拿「HTML 标记」里的 content 值填这里。
#   也可以直接把 Google 给的 html 文件丢进 static/（现已有 googlec0a585e59e234aed.html）。
google_verify = ""

# 百度搜索资源平台验证串。2026-09-18 填入，输出为
#   <meta name="baidu-site-verification" content="YVM1HE4ka9smKP0m">
# baidu-push（CI 里的推送步骤）依赖站长平台的站点归属验证，此值必须长期有效。
#   若站长平台显示「验证失败」，先确认平台给的是哪种方式：
#     - HTML标签验证 → 本字段（当前方式）
#     - 文件验证     → 需另放 static/baidu_verify_<串>.html
baidu_verify = "YVM1HE4ka9smKP0m"

baidu_tongji = "10d1cd6a3ceba53d97fa13e1b96ce44d"
google_analytics = ""